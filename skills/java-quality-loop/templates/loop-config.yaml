# 代码质量循环调度配置

```yaml
name: "java_quality_loop"
schedule: "weekly"
trigger: "monday_02:00"

preflight:
  branch: "quality-loop/{cycle_id}"
  require_clean_worktree: false
  build_command: "<项目构建命令>"
  test_command: "<项目测试命令>"
  baseline_scan: "python3 scripts/dup_clusters.py --root . --min-lines 80"

budget:
  max_rounds: 5
  max_files_per_round: 80
  max_minutes_per_round: 30
  max_tokens_per_cycle: 0

phases:
  - scan:
      skills: ["code-detect-dup", "code-review"]
      outputs: ["docs/quality-loop/backlog.md", "docs/quality-loop/metrics.md"]

  - select:
      scoring: "lines * copies * safety * testability"
      allowed_classes: ["A", "B", "F"]
      blocked_classes: ["C", "D", "E", "G", "H"]
      one_target_per_round: true

  - execute:
      skills: ["code-part-modification", "code-refactor", "java-coverage"]
      isolation: "one_commit_per_round"
      rules:
        - "read_before_delete"
        - "preserve_public_api"
        - "explicit_imports"
        - "explicit_dependencies"
        - "keep_line_endings"

  - verify:
      gates:
        - "build_pass"
        - "tests_pass"
        - "no_api_break"
        - "no_semantic_change"
      on_failure: "revert_and_record"

  - review:
      skills: ["code-review"]
      checklist: ["api", "null", "exception", "resource", "concurrency", "naming"]

  - commit:
      style: "conventional"
      one_commit_per_round: true
      push: false

  - record:
      update: ["state.json", "metrics.md", "backlog.md", "decisions.md", "lessons.md", "rounds/round-{n}.md"]

stop_line:
  consecutive_build_failures: 2
  consecutive_test_failures: 1
  api_break: true
  semantic_ambiguity: true

cycle_exit:
  - "max_rounds_reached"
  - "budget_exhausted"
  - "no_safe_target"
  - "two_rounds_without_output"

reporting:
  format: "docs/quality-loop/cycle-summary.md"
  metrics: ["duplicate_clusters", "duplicate_rate", "net_lines_removed", "tests_added", "health_score"]
```
